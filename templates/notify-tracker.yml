# (Optional) Copy to .github/workflows/notify-tracker.yml in a project repo:
# on every push that changes ROADMAP.md the tracker rebuilds immediately, instead of waiting for the 3-hourly run.
#
# Needs a TRACKER_TOKEN secret in the project repo: a fine-grained token with access
# to alessiomartini/projects-overview and "Contents: Read and write" permission.
name: Update project tracker

on:
  push:
    branches: [main]
    paths: [ROADMAP.md]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.TRACKER_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/alessiomartini/projects-overview/dispatches \
            -d '{"event_type":"project-updated","client_payload":{"repo":"${{ github.repository }}"}}'
