name: Deploy sito

on:
  push:
    branches: [main]
  # Ricostruisce periodicamente per raccogliere i progressi dai repo dei progetti.
  schedule:
    - cron: '17 */3 * * *'
  # Aggiornamento immediato richiesto da un repo progetto (vedi templates/notify-tracker.yml).
  repository_dispatch:
    types: [project-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Raccogli dati dai repo dei progetti
        run: npm run fetch
        env:
          # Token read-only sui tuoi repo (serve per i privati). Se manca, legge solo i pubblici.
          REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
